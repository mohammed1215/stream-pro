name: Build Docker & Deploy to MonsterASP

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # JOB 1: BUILD & PUSH DOCKER IMAGE (UBUNTU)
  # ==========================================
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 2: DEPLOY TO MONSTERASP (WINDOWS)
  # ==========================================
  deploy-monsterasp:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies (full, for build)
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build NestJS App (plain tsc, no bundler)
        run: npm run build
        # This should run Nest's own build (nest build / tsc) producing dist/main.js
        # via the standard NestJS CLI output — no ncc, no bundling.

      - name: Install Production Dependencies
        shell: pwsh
        run: |
          # Fresh prod-only node_modules — includes @prisma/client, generated
          # client at src/generated/prisma is copied separately below since
          # it's outside node_modules and not reinstalled by npm.
          npm ci --omit=dev

      - name: Prepare Deployment Folder
        shell: pwsh
        run: |
          # Copy production node_modules (includes @prisma/client + engine binaries
          # resolved for windows since this all runs on windows-latest)
          Copy-Item -Path "node_modules" -Destination "dist/node_modules" -Recurse

          # Copy the custom-output generated Prisma client
          Copy-Item -Path "src/generated/prisma" -Destination "dist/generated/prisma" -Recurse

          # Copy Prisma schema (needed if you run migrations from the server, optional otherwise)
          Copy-Item -Path "prisma" -Destination "dist/prisma" -Recurse

          # Copy package.json + lockfile for reference
          Copy-Item -Path "package.json" -Destination "dist/package.json"

      - name: Debug - list dist contents
        shell: pwsh
        run: Get-ChildItem -Path "dist" -Recurse | Select-Object FullName | Select-Object -First 50

      - name: Deploy to MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: /wwwroot/
          exclude: |
            **/.git*
            **/.DS_Store
