name: Build Docker & Deploy to MonsterASP

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # JOB 1: BUILD & PUSH DOCKER IMAGE (UBUNTU)
  # ==========================================
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 2: DEPLOY TO MONSTERASP (WINDOWS)
  # ==========================================
  deploy-monsterasp:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build and Bundle NestJS App
        shell: pwsh
        run: |
          npm install -g @vercel/ncc
          # -t (transpile-only) skips TS type checking (ignores test file errors)
          # --external prevents ncc from breaking Prisma
          ncc build src/main.ts -o dist --minify -t --external @prisma/client

      # 🚨 CRITICAL STEP: Copy Prisma engine files and package.json to dist
      - name: Prepare Deployment Folder
        shell: pwsh
        run: |
          # Create node_modules in dist to hold external packages
          New-Item -ItemType Directory -Force -Path "dist/node_modules"

          # Copy Prisma schema
          Copy-Item -Path "prisma" -Destination "dist/prisma" -Recurse

          # Copy the generated Prisma client and the Windows database engine binaries
          Copy-Item -Path "node_modules/.prisma" -Destination "dist/node_modules/.prisma" -Recurse
          Copy-Item -Path "node_modules/@prisma" -Destination "dist/node_modules/@prisma" -Recurse

          # Copy package.json (MonsterASP might need it to run 'node index.js')
          Copy-Item -Path "package.json" -Destination "dist/package.json"

      - name: Deploy to MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps

          # 🎯 ONLY upload the bundled dist folder!
          local-dir: ./dist/
          server-dir: /wwwroot/
          exclude: |
            **/.git*
            **/.DS_Store
